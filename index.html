<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="description" content="A short flight through a mountain pass at dawn, rendered in your browser.">
<title>First Light</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Silkscreen:wght@400;700&display=swap">
<style>
  :root { color-scheme:dark; --paper:#f5e4ce; --muted:#ac9f95; --edge:#393439; --amber:#f5b97e; --mono:"IBM Plex Mono",monospace; --pixel:"Silkscreen",monospace; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100svh; background:#100f13; color:var(--paper); font:13px var(--mono); }
  main { max-width:1488px; margin:auto; padding:clamp(18px,4vw,60px); }
  header, footer, .actions { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  header { margin-bottom:16px; }
  .brand { display:flex; align-items:center; gap:11px; font-family:var(--pixel); white-space:nowrap; }
  .mark { width:24px; height:24px; border:1px solid #8c694c; color:var(--amber); display:grid; place-items:center; }
  .mark::before { content:""; width:10px; height:8px; background:currentColor; clip-path:polygon(50% 0,100% 100%,50% 71%,0 100%); }
  .meta, footer { font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  #stage { position:relative; isolation:isolate; overflow:hidden; aspect-ratio:2.05; min-height:380px; background:#171522; border:1px solid var(--edge); }
  canvas, #fade { position:absolute; inset:0; width:100%; height:100%; }
  canvas { image-rendering:pixelated; }
  #fade { pointer-events:none; background:#0e0c12; opacity:0; }
  #cover { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:flex-start; padding:clamp(25px,6vw,92px); background:linear-gradient(90deg,#13101be8,#16121d67 48%,transparent 79%); }
  #cover[hidden] { display:none; }
  #cover.ended { align-items:center; text-align:center; background:#0e0c12; }
  .eyebrow { color:var(--amber); text-transform:uppercase; font-size:11px; letter-spacing:.23em; margin:0 0 17px; }
  h1 { margin:0 0 20px; font:700 clamp(46px,8.2vw,124px)/.83 var(--pixel); letter-spacing:-.1em; text-transform:uppercase; text-shadow:3px 4px #2c2033; }
  #caption { max-width:30ch; line-height:1.65; color:#e2d1c3; margin:0 0 25px; }
  button { cursor:pointer; font:500 11px var(--mono); letter-spacing:.08em; text-transform:uppercase; color:var(--paper); background:#19171c; border:1px solid var(--edge); padding:0 13px; min-height:40px; }
  button:hover { border-color:var(--amber); color:var(--amber); }
  button:focus-visible { outline:2px solid var(--amber); outline-offset:4px; }
  button:disabled { opacity:.42; cursor:default; }
  #start { background:var(--amber); border-color:var(--amber); color:#241926; padding-inline:18px; font-weight:600; }
  #start:hover { background:#ffcc99; }
  .controls { display:flex; align-items:center; gap:14px; padding:12px 0; }
  .actions { gap:6px; }
  #time { color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; font-size:11px; }
  progress { flex:1; min-width:20px; height:3px; appearance:none; border:0; background:#322b34; }
  progress::-webkit-progress-bar { background:#322b34; }
  progress::-webkit-progress-value { background:var(--amber); }
  progress::-moz-progress-bar { background:var(--amber); }
  footer { border-top:1px solid #2c2830; padding-top:12px; line-height:1.55; }
  #phase { color:var(--amber); }
  @media (max-width:580px) {
    main { padding:14px; }
    #stage { aspect-ratio:4/5; min-height:0; }
    #cover { justify-content:flex-start; padding-top:16%; background:linear-gradient(135deg,#14111bd9,transparent 82%); }
    #cover.ended { justify-content:center; }
    .controls { gap:8px; }
    .actions button { padding-inline:8px; }
    footer .shortcut { display:none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand"><span class="mark" aria-hidden="true"></span>First Light</div>
    <div class="meta">Animated short · 45 sec</div>
  </header>
  <section id="stage" aria-label="First Light animation">
    <canvas id="world" aria-hidden="true"></canvas>
    <canvas id="cockpit" aria-hidden="true"></canvas>
    <div id="fade" aria-hidden="true"></div>
    <div id="cover">
      <p class="eyebrow">A flight before dawn</p>
      <h1>First<br>Light</h1>
      <p id="caption">Through a mountain pass, into the first sun of the day.</p>
      <button id="start" type="button">▶&nbsp; Play film</button>
    </div>
  </section>
  <div class="controls" aria-label="Playback controls">
    <div class="actions">
      <button id="toggle" type="button">Play</button>
      <button id="replay" type="button" disabled>Replay</button>
    </div>
    <progress id="progress" max="45" value="0" aria-label="Film progress"></progress>
    <span id="time">0:00 / 0:45</span>
  </div>
  <footer>
    <span id="phase">Ready</span>
    <span class="shortcut">Space to pause · R to replay</span>
  </footer>
</main>
<script>
"use strict";
const byId = id => document.getElementById(id);
const stage = byId("stage");
const cover = byId("cover");
const duration = 45;
let elapsed = 0;
let started = false;
let playing = false;
let previousFrame = null;
let frameRequest = 0;

function updatePlayer() {
  const ended = elapsed >= duration;
  cover.hidden = started && !ended;
  cover.classList.toggle("ended", ended);
  byId("caption").hidden = ended;
  const coverAction = ended ? "↻  Play again" : "▶  Play film";
  if (byId("start").textContent !== coverAction) byId("start").textContent = coverAction;
  const action = playing ? "Pause" : ended ? "Replay" : started ? "Resume" : "Play";
  if (byId("toggle").textContent !== action) byId("toggle").textContent = action;
  byId("replay").disabled = !started;
  byId("progress").value = elapsed;
  const timecode = "0:" + String(Math.floor(elapsed)).padStart(2, "0") + " / 0:45";
  if (byId("time").textContent !== timecode) byId("time").textContent = timecode;
  const phase = !started ? "Ready" : ended ? "End of flight" : elapsed < 14 ? "Mountain pass" : elapsed < 25 ? "Inside the cloud" : "Above the valley";
  const status = !playing && started && !ended ? "Paused · " + phase : phase;
  if (byId("phase").textContent !== status) byId("phase").textContent = status;
}

function tick(now) {
  frameRequest = 0;
  if (previousFrame !== null) elapsed = Math.min(duration, elapsed + Math.min((now - previousFrame) / 1000, 0.12));
  previousFrame = now;
  if (elapsed >= duration) playing = false;
  render();
  updatePlayer();
  if (playing) frameRequest = requestAnimationFrame(tick);
}

function play(restart = false) {
  if (!renderer) return;
  if (restart || elapsed >= duration) elapsed = 0;
  started = true;
  playing = true;
  previousFrame = null;
  updatePlayer();
  render();
  if (!frameRequest) frameRequest = requestAnimationFrame(tick);
}

function togglePlayback() {
  if (!playing) {
    play();
    return;
  }
  cancelAnimationFrame(frameRequest);
  frameRequest = 0;
  playing = false;
  updatePlayer();
}
byId("start").addEventListener("click", () => {
  play(true);
  byId("toggle").focus({preventScroll:true});
});
byId("toggle").addEventListener("click", togglePlayback);
byId("replay").addEventListener("click", () => play(true));
document.addEventListener("keydown", event => {
  if (event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
  if (event.code === "Space" && !(event.target instanceof HTMLButtonElement)) {
    event.preventDefault();
    togglePlayback();
  }
  if (event.key.toLowerCase() === "r") play(true);
});
document.addEventListener("visibilitychange", () => {
  if (document.hidden && playing) togglePlayback();
});

const world = byId("world");
const gl = world.getContext("webgl2", {alpha:false, antialias:false, powerPreference:"default"});
function smooth(a, b, value) {
  const t = Math.max(0, Math.min(1, (value - a) / (b - a)));
  return t * t * (3 - 2 * t);
}
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];

function shot(t) {
  const rise = smooth(12, 26, t);
  const bank = smooth(24, 32, t) * (1 - smooth(35, 43, t));
  const cloud = smooth(12, 17, t) * (1 - smooth(21, 26, t));
  const dawn = smooth(17, 30, t);
  const yaw = -0.04 + 0.06 * Math.sin(t * 0.24) + 0.36 * smooth(25, 37, t);
  const pitch = 0.015 + 0.073 * cloud - 0.19 * smooth(24, 34, t) + 0.044 * smooth(39, 44, t);
  const roll = 0.035 * Math.sin(t * 0.62) - 0.235 * bank + 0.024 * cloud * Math.sin(t * 8);
  const altitude = 149 + 243 * rise + 5 * Math.sin(t * 0.7) + cloud * 2 * Math.sin(t * 11);
  const position = [-60 + 105 * Math.sin(t * 0.05) + 230 * smooth(25, 46, t), altitude, t * 59];
  const forward = [Math.sin(yaw)*Math.cos(pitch), Math.sin(pitch), Math.cos(yaw)*Math.cos(pitch)];
  const levelRight = [Math.cos(yaw), 0, -Math.sin(yaw)];
  const levelUp = cross(forward, levelRight);
  const right = levelRight.map((v, i) => v*Math.cos(roll) + levelUp[i]*Math.sin(roll));
  const up = cross(forward, right);
  return {t, dawn, cloud, bank, pitch, roll, altitude, position, forward, right, up};
}

const shaderHeader = `#version 300 es
precision highp float;
uniform vec2 resolution;
uniform vec3 eye, forward, right, up;
uniform float clock, dawn, cloud, lens;
const vec3 sun = vec3(0.376, 0.105, 0.921);
float hash(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * .1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  f = f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+1.),f.x),f.y);
}
float fbm(vec2 p) {
  return .55*noise(p)+.27*noise(2.12*p)+.12*noise(4.23*p)+.06*noise(8.61*p);
}
vec3 air(vec3 ray) {
  float height = max(ray.y, 0.);
  float azimuth = pow(max(dot(ray, sun), 0.), 7.);
  vec3 horizon = mix(vec3(.31,.26,.40), mix(vec3(.69,.43,.42),vec3(1.,.70,.43),azimuth), dawn);
  vec3 zenith = mix(vec3(.045,.062,.14),vec3(.17,.23,.38),dawn);
  return mix(horizon,zenith,1.-exp(-4.2*height));
}
vec3 finish(vec3 color) {
  vec2 p = gl_FragCoord.xy / resolution;
  float grain = (hash(gl_FragCoord.xy)-.5)*.016;
  float edge = 1.-.28*dot(p-.5,p-.5);
  return floor(clamp(color*edge+grain,0.,1.)*75.+.5)/75.;
}
vec3 inCloud(vec3 color) {
  vec2 q = gl_FragCoord.xy/resolution.y;
  float billow = fbm(q*4. + vec2(clock*.17,clock*.08));
  float whiteout = clamp(cloud*1.26 + (billow-.5)*cloud*.53,0.,.985);
  vec3 vapor = mix(vec3(.35,.35,.49),vec3(.96,.84,.76),dawn) * (.82+billow*.30);
  return mix(color,vapor,whiteout);
}
`;

const skyVertex = `#version 300 es
void main() {
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  gl_Position = vec4(p * 2. - 1., 0., 1.);
}`;
const skyFragment = shaderHeader + `
out vec4 color;
void main() {
  vec2 uv = (gl_FragCoord.xy * 2. - resolution) / resolution.y;
  vec3 ray = normalize(forward + (right*uv.x + up*uv.y)*lens);
  vec3 sky = air(ray);
  float angle = length(ray-sun);
  sky += dawn * (vec3(.34,.13,.035)*exp(-angle*9.) + vec3(1.,.65,.34)*(1.-smoothstep(.034,.041,angle)));
  vec2 grid = floor(vec2(atan(ray.x,ray.z), ray.y)*450.);
  float stars = step(.9977,hash(grid))*smoothstep(.07,.38,ray.y)*(1.-dawn);
  sky += stars*vec3(.55,.54,.63);
  // Two distant cloud decks. Perspective compresses their edges at the horizon.
  for(int i=0;i<2;++i) {
    float layer = float(i);
    float distance = (760.+layer*520.-eye.y)/max(ray.y+.027,.012);
    vec2 point = (eye.xz + ray.xz*distance)*vec2(.00075,.0020) + vec2(layer*11.,clock*.024);
    float density = fbm(point);
    float opacity = smoothstep(.50,.67,density)*smoothstep(-.017,.065,ray.y) * (.66-layer*.21);
    vec3 shadow = mix(vec3(.10,.13,.24),vec3(.36,.29,.42),dawn);
    vec3 rim = mix(vec3(.34,.31,.43),vec3(.91,.53,.40),dawn);
    sky = mix(sky,mix(shadow,rim,(1.-smoothstep(.48,.68,density))),opacity);
  }
  color = vec4(finish(inCloud(sky)),1.);
}
`;

const terrainVertex = shaderHeader + `
layout(location=0) in vec3 point;
out vec3 position;
out float ground;
void main() {
  position = vec3(point.x,max(0.,point.y),point.z);
  ground = point.y;
  vec3 delta = position-eye;
  float depth = dot(forward,delta);
  gl_Position = vec4(dot(right,delta)/(lens*resolution.x/resolution.y),
                     dot(up,delta)/lens, depth*1.00083-7.003, depth);
}
`;
const terrainFragment = shaderHeader + `
in vec3 position;
in float ground;
out vec4 color;
void main() {
  vec3 delta = position-eye;
  float distance = length(delta);
  vec3 ray = normalize(delta);
  vec3 normal = normalize(cross(dFdx(position),dFdy(position)));
  normal *= normal.y < 0. ? -1. : 1.;
  float rock = fbm(position.xz*.033 + position.y*.015);
  vec3 stone = mix(vec3(.095,.125,.158),vec3(.32,.30,.36),rock);
  float trees = (1.-smoothstep(185.,395.,position.y))*smoothstep(.43,.78,normal.y);
  stone = mix(stone,mix(vec3(.067,.108,.121),vec3(.20,.26,.24),rock),trees);
  float snow = smoothstep(350.,580.,position.y+rock*160.)*smoothstep(.39,.8,normal.y);
  stone = mix(stone,mix(vec3(.35,.39,.51),vec3(.88,.82,.76),rock),snow);
  float light = max(dot(normal,normalize(vec3(.72,.35,.22))),0.);
  vec3 land = stone * (vec3(.43,.48,.70) + dawn*(vec3(.16,.12,.08) + light*vec3(.97,.59,.32)));
  if (ground <= .05) {
    float wave = noise(position.xz * vec2(.022,.11) + vec2(0.,clock*.62));
    float wake = smoothstep(.63,.81,wave);
    float reflection = exp(-abs(ray.x-sun.x)*15.) * exp(-abs(ray.y+.105)*4.);
    land = mix(vec3(.062,.10,.16),vec3(.15,.24,.31),dawn);
    land += vec3(.043,.055,.072)*wave + dawn*reflection*(.18+.68*wake)*vec3(.56,.27,.12);
  }
  float fog = 1.-exp(-distance*.00039);
  fog = max(fog,.91*smoothstep(5100.,8200.,distance));
  vec3 haze = air(ray)*mix(vec3(.70,.74,.83),vec3(.86,.77,.85),dawn);
  color = vec4(finish(inCloud(mix(land,haze,fog))),1.);
}`;

function makeProgram(vertex, fragment) {
  const program = gl.createProgram();
  for (const [type, source] of [[gl.VERTEX_SHADER, vertex], [gl.FRAGMENT_SHADER, fragment]]) {
    const shader = gl.createShader(type);
    gl.shaderSource(shader, source);
    gl.compileShader(shader);
    if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
    gl.attachShader(program, shader);
    gl.deleteShader(shader);
  }
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
  const uniforms = {};
  for (const name of ["resolution","eye","forward","right","up","clock","dawn","cloud","lens"]) {
    uniforms[name] = gl.getUniformLocation(program, name);
  }
  return {program, uniforms};
}

function terrainHeight(x, z) {
  const center = 128 * Math.sin(z * .0011) + 0.15 * Math.max(0, z - 1350);
  const offset = Math.abs(x - center);
  const opening = smooth(520, 1800, z);
  const valley = smooth(78 + opening*290, 435 + opening*510, offset);
  const ridges = .53 + .22*Math.sin(x*.0033+z*.0019) + .18*Math.cos(z*.005-x*.002)
    + .10*Math.sin(z*.012+x*.009) + .06*Math.cos(z*.027-x*.023);
  const teeth = Math.abs(Math.sin(x*.007+z*.0047)*Math.cos(z*.0031-x*.002));
  const shoulders = Math.exp(-(((offset-335-opening*510)/300)**2)) * (.58+.42*Math.cos(z*.004));
  return -29 + 26*Math.sin(x*.018+z*.008)*smooth(55, 330, offset)
    + valley*(110+ridges*565+teeth*180) + shoulders*228;
}

function makeTerrain() {
  const columns = 269, rows = 283, step = 33;
  const vertices = new Float32Array(columns * rows * 3);
  const indices = new Uint32Array((columns - 1) * (rows - 1) * 6);
  let vertex = 0, index = 0;
  for (let z = 0; z < rows; z++) {
    for (let x = 0; x < columns; x++) {
      const px = (x - (columns-1)/2)*step;
      const pz = z*step - 550;
      vertices[vertex++] = px;
      vertices[vertex++] = terrainHeight(px, pz);
      vertices[vertex++] = pz;
      if (x === columns-1 || z === rows-1) continue;
      const i = z*columns+x;
      indices.set([i,i+columns,i+1,i+1,i+columns,i+columns+1], index);
      index += 6;
    }
  }
  const mesh = gl.createVertexArray();
  gl.bindVertexArray(mesh);
  const positions = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, positions);
  gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
  const faces = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, faces);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indices, gl.STATIC_DRAW);
  return {mesh, count:indices.length};
}

let renderer;
function initWorld() {
  if (!gl) throw new Error("WebGL2 is unavailable.");
  renderer = {
    sky:makeProgram(skyVertex,skyFragment),
    terrain:makeProgram(terrainVertex,terrainFragment),
    empty:gl.createVertexArray(),
    ...makeTerrain()
  };
}

function drawWorld(frame) {
  const width = stage.clientWidth, height = stage.clientHeight;
  const scale = Math.min(.61, 700 / Math.max(width,height));
  const pixelWidth = Math.max(1,Math.round(width*scale));
  const pixelHeight = Math.max(1,Math.round(height*scale));
  if (world.width !== pixelWidth || world.height !== pixelHeight) {
    world.width = pixelWidth;
    world.height = pixelHeight;
  }
  gl.viewport(0,0,world.width,world.height);
  function use({program,uniforms:u}) {
    gl.useProgram(program);
    gl.uniform2f(u.resolution,world.width,world.height);
    gl.uniform3fv(u.eye,frame.position);
    gl.uniform3fv(u.right,frame.right);
    gl.uniform3fv(u.up,frame.up);
    gl.uniform3fv(u.forward,frame.forward);
    gl.uniform1f(u.clock,frame.t);
    gl.uniform1f(u.dawn,frame.dawn);
    gl.uniform1f(u.cloud,frame.cloud);
    gl.uniform1f(u.lens,width < height ? .72 : .56);
  }
  gl.disable(gl.DEPTH_TEST);
  use(renderer.sky);
  gl.bindVertexArray(renderer.empty);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.clear(gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  use(renderer.terrain);
  gl.bindVertexArray(renderer.mesh);
  gl.drawElements(gl.TRIANGLES,renderer.count,gl.UNSIGNED_INT,0);
}

const cockpit = byId("cockpit");
const ink = cockpit.getContext("2d");

function polygon(points, fill, stroke, width = 1) {
  ink.beginPath();
  points.forEach(([x,y], i) => i ? ink.lineTo(x,y) : ink.moveTo(x,y));
  ink.closePath();
  if (fill) { ink.fillStyle = fill; ink.fill(); }
  if (stroke) { ink.strokeStyle = stroke; ink.lineWidth = width; ink.stroke(); }
}

function line(points, color, width = 1) {
  ink.beginPath();
  points.forEach(([x,y], i) => i ? ink.lineTo(x,y) : ink.moveTo(x,y));
  ink.strokeStyle = color;
  ink.lineWidth = width;
  ink.stroke();
}

function circle(x, y, radius, fill, stroke) {
  ink.beginPath();
  ink.arc(x,y,radius,0,Math.PI*2);
  ink.fillStyle = fill;
  ink.fill();
  if (stroke) { ink.lineWidth = 1.5; ink.strokeStyle = stroke; ink.stroke(); }
}

function panelText(text, x, y, size, color, align = "center") {
  ink.font = size + 'px "IBM Plex Mono", monospace';
  ink.textAlign = align;
  ink.fillStyle = color;
  ink.fillText(text,x,y);
}

function gauge(x, y, radius, label, value, angle, frame) {
  const glow = frame.dawn > .45 ? "#f4c888" : "#dbac76";
  circle(x,y,radius+5,"#101017","#6c534a");
  circle(x,y,radius,"#211c25","#3d3137");
  for (let i = 0; i <= 24; i++) {
    const a = Math.PI * (.76 + i*.0616);
    const major = i % 4 === 0;
    const inner = radius - (major ? 9 : 5);
    const outer = radius - 3;
    line([[x+Math.cos(a)*inner,y+Math.sin(a)*inner],[x+Math.cos(a)*outer,y+Math.sin(a)*outer]],
         major ? glow : "#785d57",major ? 1.7 : 1);
  }
  panelText(label,x,y-radius*.30,8,"#bea08a");
  polygon([[x-2,y],[x+Math.cos(angle)*(radius-8),y+Math.sin(angle)*(radius-8)],[x+2,y+2]],glow);
  circle(x,y,3,"#edc59a","#523e39");
  panelText(value,x,y+radius*.59,10,glow);
}

function attitude(x, y, radius, frame) {
  circle(x,y,radius+6,"#111018","#76584e");
  ink.save();
  ink.beginPath();
  ink.arc(x,y,radius,0,Math.PI*2);
  ink.clip();
  ink.translate(x,y);
  ink.rotate(-frame.roll);
  const horizon = frame.pitch * radius * 2.15;
  ink.fillStyle = "#3a5264";
  ink.fillRect(-radius*2,-radius*2,radius*4,radius*4);
  ink.fillStyle = "#684659";
  ink.fillRect(-radius*2,horizon,radius*4,radius*3);
  for (let i = -2; i <= 2; i++) {
    const span = i === 0 ? radius*2 : i%2 ? radius*.24 : radius*.43;
    line([[-span,horizon+i*10],[span,horizon+i*10]],"#dfc0a1",i === 0 ? 1.5 : 1);
  }
  ink.restore();
  line([[x-22,y],[x-10,y],[x-7,y+5],[x+7,y+5],[x+10,y],[x+22,y]],"#ffd095",2.2);
  polygon([[x-4,y-radius+8],[x+4,y-radius+8],[x,y-radius+14]],"#ffd095");
}

function drawCockpit(frame) {
  const width = world.width, height = world.height;
  if (cockpit.width !== width || cockpit.height !== height) {
    cockpit.width = width;
    cockpit.height = height;
  }
  ink.setTransform(1,0,0,1,0,0);
  ink.clearRect(0,0,width,height);
  ink.scale(width/1000,height/520);

  const light = frame.dawn;
  const rim = light > .44 ? "#987358" : "#54424c";
  polygon([[0,0],[145,0],[110,11],[58,21],[25,72],[0,207]],"#14131d",rim,2);
  polygon([[1000,0],[855,0],[890,11],[942,21],[975,72],[1000,207]],"#14131d",rim,2);
  line([[0,174],[16,68],[52,18],[123,1]],"#2a2831",4);
  line([[1000,174],[984,68],[948,18],[877,1]],"#2a2831",4);
  polygon([[0,164],[17,114],[31,332],[67,420],[0,486]],"#15131d",rim,2);
  polygon([[1000,164],[983,114],[969,332],[933,420],[1000,486]],"#15131d",rim,2);
  line([[10,177],[24,335],[50,403]],"#35313a",4);
  line([[990,177],[976,335],[950,403]],"#35313a",4);

  const dash = ink.createLinearGradient(0,383,0,520);
  dash.addColorStop(0,light > .44 ? "#3d2d35" : "#292432");
  dash.addColorStop(.38,"#1e1a24");
  dash.addColorStop(1,"#100f17");
  polygon([[0,423],[109,403],[260,390],[353,386],[393,371],[607,371],[647,386],[740,390],[891,403],[1000,423],[1000,520],[0,520]],dash,rim,2);
  line([[0,436],[110,415],[267,403],[353,399],[402,383],[598,383],[647,399],[733,403],[890,415],[1000,436]],"#473841",2);
  polygon([[282,430],[300,412],[700,412],[718,430],[718,520],[282,520]],"#1a161f","#59454a");
  line([[290,513],[290,434],[304,420],[696,420],[710,434],[710,513]],"#332a35",1.5);

  // Keep round instruments circular when the viewport changes aspect ratio.
  ink.save();
  const stretch = (height/520) / (width/1000);
  ink.translate(500,0);
  ink.scale(stretch,1);
  const climb = smooth(12,21,frame.t) * (1-smooth(22,29,frame.t));
  const airspeed = 112 + 19*frame.bank - 9*climb + 3*Math.sin(frame.t*.9);
  const flutter = .025 * Math.sin(frame.t*17) * (1+2*frame.cloud);
  gauge(-111,467,36,"KNOTS",Math.round(airspeed),4.15+(airspeed-105)*.034+flutter,frame);
  attitude(0,467,39,frame);
  gauge(111,467,36,"ALT · FT",Math.round(frame.altitude*3.281),3.7+frame.altitude*.0064+flutter,frame);
  ink.restore();

  if (width/height > 1.2) {
    polygon([[102,448],[109,432],[228,424],[246,437],[246,498],[101,505]],"#201a24","#503d45");
    polygon([[898,448],[891,432],[772,424],[754,437],[754,498],[899,505]],"#201a24","#503d45");
    panelText("CABIN",176,449,9,"#be9d86");
    panelText("ON",823,448,9,"#be9d86");
    for (let i=0;i<4;i++) {
      const x = 141+i*24;
      circle(x,465,4,i===0 ? "#e3a96e" : "#362b31","#6a5150");
      line([[x+648,477],[x+648,461]],"#6c5556",5);
      line([[x+645,465+i*2],[x+651,465+i*2]],"#dbac76",2);
    }
    line([[123,489],[224,483]],"#3f333c");
    line([[776,483],[877,489]],"#3f333c");
  }

  // A little warm glass reflection from the panel after the sun comes up.
  if (light > 0) {
    ink.globalAlpha = light * .13;
    polygon([[650,380],[726,363],[930,369],[952,388],[904,388],[842,378]],"#f2a46f");
    ink.globalAlpha = 1;
  }
}

function render() {
  if (!renderer) return;
  const frame = shot(started ? elapsed : stage.clientWidth < stage.clientHeight ? 37 : 34);
  drawWorld(frame);
  drawCockpit(frame);
  byId("fade").style.opacity = started ? Math.max(1-smooth(0, 1.7, elapsed), smooth(42, 45, elapsed)) : 0;
}

function showError(error) {
  renderer = null;
  if (playing) togglePlayback();
  document.querySelectorAll("button").forEach(button => { button.disabled = true; });
  byId("caption").textContent = "First Light needs a browser with WebGL2 enabled.";
  byId("phase").textContent = "Playback unavailable";
  console.error(error);
}

try {
  initWorld();
  updatePlayer();
  render();
} catch (error) {
  showError(error);
}
new ResizeObserver(render).observe(stage);
</script>
</body>
</html>
